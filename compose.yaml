services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: boricuabite
      POSTGRES_USER: boricuabite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - boricuabite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boricuabite -d boricuabite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boricuabite-postgres:
