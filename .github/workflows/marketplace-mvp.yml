name: Marketplace MVP validation

on:
  push:
    branches:
      - feature/marketplace-mvp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__BoricuaBite: Host=localhost;Port=5432;Database=boricuabite_design;Username=postgres;Password=design-only

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET
        run: dotnet restore backend/BoricuaBite.sln

      - name: Build .NET
        run: dotnet build backend/BoricuaBite.sln --no-restore --configuration Release

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Generate marketplace migration when missing
        shell: bash
        run: |
          if ! find backend/BoricuaBite.Infrastructure/Persistence/Migrations -name '*_MarketplaceMvp.cs' | grep -q .; then
            dotnet tool run dotnet-ef migrations add MarketplaceMvp \
              --project backend/BoricuaBite.Infrastructure \
              --startup-project backend/BoricuaBite.Api \
              --output-dir Persistence/Migrations \
              -- --environment Development
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/BoricuaBite.Infrastructure/Persistence/Migrations
            git commit -m "Generate marketplace MVP migration"
            git push origin HEAD:feature/marketplace-mvp
          fi

      - name: Run .NET tests
        run: dotnet test backend/BoricuaBite.sln --no-restore --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
